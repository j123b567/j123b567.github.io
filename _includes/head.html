<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFAD40">
    {%- if page.title == "" %}
    {%- seo title=false %}
    <title>{{ site.title }}</title>
    {%- else %}
    {%- seo %}
    {%- endif %}
    <link rel="stylesheet" href="{{ site.baseurl }}/ui/syntax.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/ui/style.css">
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any">
    <link rel="icon" href="{{ site.baseurl }}/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.baseurl }}/atom.xml">
</head>
