# Dependencies
plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

markdown:         kramdown
highlighter:      rouge

# Permalinks
permalink:        pretty
#relative_permalinks: true

# Setup
title:            JayBee
description:      "Doplňuji, co jinde chybí: dokumentaci, kterou nikdo nenapsal, knihovnu, kterou každý psal znovu, nástroj, který neexistoval, chybu hardwaru, která se nedostala ani do errat."
# Header subtitle: fixed lead followed by endings that rotate; the first ending is the default
tagline_lead:     "Doplňuji, co jinde chybí:"
taglines:
  - dokumentaci, kterou nikdo nenapsal.
  - knihovnu, kterou každý psal znovu.
  - nástroj, který neexistoval.
  - chybu hardwaru, která se nedostala ani do errat.
lang:             cs
url:              https://www.jaybee.cz
baseurl:

author:
  name:           'Jan Breuer'
  url:            https://www.jaybee.cz

# paginate:         10
# paginate_path:    "/posts/page:num/"

github:
  repo:           https://github.com/j123b567

collections:
  software:
    output: true
    permalink: /software/:path/

defaults:
 - scope:
     path: ""
     type: software
   values:
     layout: page
 - scope:
     path: ""
   values:
     lang: cs
